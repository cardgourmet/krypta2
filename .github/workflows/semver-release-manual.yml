name: Publish Manual Release

on:
  release:
    types: [created]

jobs:
  resolve-tag:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
    - name: set tag
      id: tag
      run: echo ::set-output name=tag::${GITHUB_REF#refs/*/}

  call-docker-deploy:
    needs: resolve-tag
    uses: cardgourmet/krypta2/.github/workflows/docker-deploy.yml@main
    with:
      tag: ${{ needs.resolve-tag.outputs.tag }}
    secrets: inherit
