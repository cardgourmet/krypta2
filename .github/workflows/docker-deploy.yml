name: Docker Build & Push

on:
  push:
    branches:
    - develop
  workflow_call:
    inputs:
      tag:
        description: 'Tag to use for the image in addition to `latest`'
        required: true
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      IMAGE_TAG: ${{ inputs.tag || github.sha }}
    steps:
    - uses: actions/checkout@v4
    - uses: docker/setup-buildx-action@v2
    - name: Login
      uses: docker/login-action@v2
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Build and Push (Dev)
      uses: docker/build-push-action@v2
      with:
        platforms: linux/amd64
        push: true
        file: Dockerfile
        build-args: |
          APP_VERSION=${{ env.IMAGE_TAG }}
          VITE_API_BASE_URL=${{ vars.DEV_CARDGOURMET_API_URL }}
          VITE_OAUTH_GOOGLE_CLIENT_ID=${{ vars.DEV_OAUTH_GOOGLE_CLIENT_ID }}
          VITE_CARDGOURMET_BASIC_USERNAME=${{ secrets.DEV_CARDGOURMET_BASIC_USERNAME }}
          VITE_CARDGOURMET_BASIC_PASSWORD=${{ secrets.DEV_CARDGOURMET_BASIC_PASSWORD }}
        tags: ghcr.io/cardgourmet/krypta2:${{ env.IMAGE_TAG }},ghcr.io/cardgourmet/krypta2:latest-dev
        cache-from: type=gha
        cache-to: type=gha,mode=max
    - name: Build and Push (Prod)
      if: github.event_name == 'workflow_call'
      uses: docker/build-push-action@v2
      with:
        platforms: linux/amd64
        push: true
        file: Dockerfile
        build-args: |
          APP_VERSION=${{ env.IMAGE_TAG }}
          VITE_API_BASE_URL=${{ vars.PROD_CARDGOURMET_API_URL }}
          VITE_OAUTH_GOOGLE_CLIENT_ID=${{ vars.PROD_OAUTH_GOOGLE_CLIENT_ID }}
          VITE_CARDGOURMET_BASIC_USERNAME=${{ secrets.PROD_CARDGOURMET_BASIC_USERNAME }}
          VITE_CARDGOURMET_BASIC_PASSWORD=${{ secrets.PROD_CARDGOURMET_BASIC_PASSWORD }}
        tags: ghcr.io/cardgourmet/krypta2:${{ env.IMAGE_TAG }},ghcr.io/cardgourmet/krypta2:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max
