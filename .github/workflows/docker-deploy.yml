name: Docker Build & Push

on:
  workflow_call:
    inputs:
      tag:
        description: 'Tag to use for the image in addition to `latest`'
        required: true
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: docker/setup-buildx-action@v2
    - name: Login
      uses: docker/login-action@v2
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Build and Push
      uses: docker/build-push-action@v2
      with:
        platforms: linux/amd64
        push: true
        file: Dockerfile
        build-args: |
          VITE_API_BASE_URL=${{ vars.CARDGOURMET_API_URL }}
          VITE_OAUTH_GOOGLE_CLIENT_ID=${{ vars.OAUTH_GOOGLE_CLIENT_ID }}
          VITE_CARDGOURMET_BASIC_USERNAME=${{ secrets.CARDGOURMET_BASIC_USERNAME }}
          VITE_CARDGOURMET_BASIC_PASSWORD=${{ secrets.CARDGOURMET_BASIC_PASSWORD }}
        tags: ghcr.io/cardgourmet/krypta2:${{ inputs.tag }},ghcr.io/cardgourmet/krypta2:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max
